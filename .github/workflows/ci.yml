name: ci
on:
  push:
    branches: [main]
    paths-ignore: ['bootstrap/**', 'ops/**', 'seed/**']
  workflow_dispatch: {}
permissions: { contents: write, id-token: write }
concurrency: { group: ci, cancel-in-progress: false }
jobs:
  test:
    uses: ./.github/workflows/test.yml
  check:
    runs-on: ubuntu-latest
    outputs: { wif: "${{ steps.c.outputs.wif }}" }
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: echo "wif=$(test -f .github/wif.json && echo yes || echo no)" >> "$GITHUB_OUTPUT"
  deploy:
    needs: [test, check]
    if: ${{ needs.check.outputs.wif == 'yes' }}
    uses: ./.github/workflows/deploy.yml
